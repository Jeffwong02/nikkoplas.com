name = "nikkoplas-chatbot"
main = "src/index.js"
compatibility_date = "2024-11-01"

# Update this to your live site origin(s). The worker only answers
# browser requests whose Origin header matches this value, so random
# scripts elsewhere on the internet can't ride on your AI quota.
[vars]
ALLOWED_ORIGIN = "https://www.industrinikkoplas.com"

# Cloudflare Workers AI binding — runs the model directly inside the
# Worker, no external API key or account needed.
[ai]
binding = "AI"
