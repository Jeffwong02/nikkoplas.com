name = "nikkoplas-chatbot"
main = "src/index.js"
compatibility_date = "2024-11-01"

# Update this to your live site origin(s). The worker only answers
# browser requests whose Origin header matches this value, so random
# scripts elsewhere on the internet can't ride on your Gemini quota.
[vars]
ALLOWED_ORIGIN = "https://www.industrinikkoplas.com"

# The Gemini API key itself is NOT set here — it's a secret, set with:
#   npx wrangler secret put GEMINI_API_KEY
# so it never ends up in this file or in git.
